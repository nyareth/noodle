services:
  db:
    image: postgres:latest
    container_name: quiz-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: quiz
      POSTGRES_PASSWORD: quiz
      POSTGRES_DB: quiz
    volumes:
      - pgdata:/var/lib/postgresql # <-- Removed "/data" from the container path

volumes:
  pgdata:

